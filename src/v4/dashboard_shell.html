<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | KaushalSetu</title>
<meta name="description" content="KaushalSetu dashboard (Bridging Skills. Forecasting Futures.) Five-year forecasts of employment, vacancies and job seekers for 317 districts, 5 sectors and 25 trades, with a Demand Index, capacity gap and early-warning flags. Simulated data.">
<meta name="theme-color" content="#0A0E16">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<script>(function(){var s={};try{s=JSON.parse(localStorage.getItem('lmis-display')||'{}')}catch(e){}document.documentElement.dataset.theme=s.theme==='light'?'light':'dark';document.documentElement.dataset.lang=s.lang==='hi'?'hi':'en';document.documentElement.lang=s.lang==='hi'?'hi':'en';
var d={};try{d=JSON.parse(localStorage.getItem('lmis-dash')||'{}')}catch(e){}if(d.collapsed)document.documentElement.classList.add('sb-collapsed');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Noto+Sans+Devanagari:wght@400..700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Noto+Sans+Devanagari:wght@400..700&display=swap"></noscript>
<link rel="stylesheet" href="dashboard.css?v={CSS}">
<link rel="stylesheet" href="../assets/chat.css?v={CHATCSS}">
</head>
<body data-map="../data/map_data.js?v={MAPDATA}">
<a class="skip" href="#view" data-t="Skip to the page">Skip to the page</a>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="sb-toggle" type="button" aria-label="Collapse the menu" aria-expanded="true" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="tb-brand" href="#/overview" aria-label="KaushalSetu dashboard home">
      {LOGO}
      <span>Kaushal<b>Setu</b></span><em data-t="Dashboard">Dashboard</em>
    </a>
    <div class="tb-title"><h1 id="page-title">Overview</h1><span id="page-sub"></span></div>
    <div class="tb-right">
      <span class="tb-origin" id="tb-origin"></span>
      <button class="icon-btn lang-btn" id="lang-toggle" type="button" aria-label="Switch between English and Hindi"><span id="lang-label">हिं</span></button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between dark and light theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <a class="btn-exit" id="exit-top" href="../index.html" title="Leave the dashboard and return to the website"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10"/></svg><span data-t="Exit">Exit</span></a>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Dashboard pages">
    <nav>
      <ul id="nav">
        <li><a href="#/overview" data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/></svg><span data-t="Overview">Overview</span></a></li>
        <li><a href="#/map" data-page="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.4-6-10a6 6 0 0 1 12 0c0 4.6-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg><span data-t="Map">Map</span></a></li>
        <li><a href="#/forecast" data-page="forecast"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg><span data-t="Forecast">Forecast</span></a></li>
        <li><a href="#/index" data-page="index"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 12l4-3M12 4v2M4 12h2M18 12h2"/></svg><span data-t="Demand Index">Demand Index</span></a></li>
        <li><a href="#/capacity" data-page="capacity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M6 20h12M5 8h14M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z"/></svg><span data-t="Capacity gap">Capacity gap</span></a></li>
        <li><a href="#/ranking" data-page="ranking"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-t="Rankings">Rankings</span></a></li>
        <li><a href="#/warnings" data-page="warnings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg><span data-t="Early warnings">Early warnings</span></a></li>
        <li><a href="#/data" data-page="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.700 3.100 3 7 3s7-1.300 7-3V6M5 12v6c0 1.700 3.100 3 7 3s7-1.300 7-3v-6"/></svg><span data-t="Data and notes">Data and notes</span></a></li>
      </ul>
    </nav>
    <div class="sb-foot">
      <a class="btn-exit" id="exit-side" href="../index.html" title="Leave the dashboard and return to the website"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10"/></svg><span data-t="Exit">Exit</span></a>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <div class="filters" id="filters" role="group" aria-label="Filters for every page">
      <label><span data-t="Sector">Sector</span><select id="f-sector"></select></label>
      <label><span data-t="Trade">Trade</span><select id="f-trade"></select></label>
      <label><span data-t="State">State</span><select id="f-state"></select></label>
      <label><span data-t="District">District</span><select id="f-district"></select></label>
      <button class="chip-btn" id="f-reset" type="button" data-t="Reset filters">Reset filters</button>
      <button class="chip-btn primary" id="f-csv" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span data-t="CSV">CSV</span></button>
      <button class="chip-btn primary" id="f-json" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span data-t="JSON">JSON</span></button>
    </div>
    <div class="view" id="view" tabindex="-1" aria-live="polite"><p class="loading">Loading the dashboard…</p></div>
  </main>

  <footer class="foot" id="foot"><span data-t="Simulated data, not official statistics">Simulated data, not official statistics</span> &middot; <span data-t="Forecast from">Forecast from</span> <span id="foot-origin"></span> &middot; KaushalSetu</footer>
</div>
<div class="tip" id="tip" role="status" hidden></div>
<script src="data/core.js?v={CORE}"></script>
<script src="data/alerts.js?v={ALERTS}"></script>
<script src="data/names_hi.js?v={NAMES}"></script>
<script src="dashboard.js?v={JS}"></script>
<script src="../assets/chat.js?v={CHATJS}"></script>
</body>
</html>
