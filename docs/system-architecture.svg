<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 961" width="1200" height="961" role="img" aria-labelledby="t d">
  <title id="t">KaushalSetu system architecture</title>
  <desc id="d">Simulated data flows up through the ML engine and the export pipeline into data files served by Vercel to the website, the dashboard, the assistant and the read-only forecast API, which users read.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A4A"/><stop offset=".55" stop-color="#0E3A9A"/><stop offset="1" stop-color="#1B62E0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".88" cy=".08" r=".6">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity=".45"/><stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".05" cy=".95" r=".5">
      <stop offset="0" stop-color="#3C7BFF" stop-opacity=".35"/><stop offset="1" stop-color="#3C7BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".09"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020B26" flood-opacity=".38"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9z" fill="#CFE2FF"/></marker>
    <style>
      text { font-family: Segoe UI, Inter, system-ui, -apple-system, Arial, sans-serif; }
      .title { fill: #FFFFFF; font-size: 32px; font-weight: 750; letter-spacing: -.01em; }
      .sub { fill: #BCD3FF; font-size: 15px; }
      .chip { fill: #FFFFFF; fill-opacity: .14; stroke: #FFFFFF; stroke-opacity: .28; }
      .chiptxt { fill: #E3EDFF; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; }
      .band { fill: #FFFFFF; fill-opacity: .07; stroke: #FFFFFF; stroke-opacity: .22; stroke-width: 1.2; }
      .card { fill: #FFFFFF; filter: url(#sh); }
      .ct { fill: #0B1B3A; font-size: 16.5px; font-weight: 700; }
      .cs { fill: #43547A; font-size: 13px; }
      .arrow { stroke: #CFE2FF; stroke-width: 2.4; fill: none; marker-end: url(#ah); stroke-linecap: round; }
      .foot { fill: #BCD3FF; font-size: 13px; }
    </style>
  </defs>
  <rect width="1200" height="961" fill="url(#bg)"/>
  <rect width="1200" height="961" fill="url(#dots)"/>
  <rect width="1200" height="961" fill="url(#glow)"/>
  <rect width="1200" height="961" fill="url(#glow2)"/>
  <text x="40" y="58" class="title">System architecture</text>
  <text x="40" y="86" class="sub">Data flows upwards, from the Python build pipeline to the people who use the site. All data is simulated.</text>
  <rect class="band" x="40" y="116" width="1120" height="142" rx="18"/>
  <rect class="chip" x="60" y="130" width="80" height="26" rx="13"/>
  <text class="chiptxt" x="73" y="147.5">PEOPLE</text>
  <g><rect class="card" x="64" y="168" width="344" height="72" rx="13"/>
  <rect x="64" y="168" width="344" height="5" rx="2.5" fill="#5B8DEF"/>
  <text class="ct" x="82" y="199">Planners and skill councils</text>
  <text class="cs" x="82" y="222">state units, training providers</text>
  </g>
  <g><rect class="card" x="428" y="168" width="344" height="72" rx="13"/>
  <rect x="428" y="168" width="344" height="5" rx="2.5" fill="#5B8DEF"/>
  <text class="ct" x="446" y="199">The public</text>
  <text class="cs" x="446" y="222">English or Hindi, phone or desktop</text>
  </g>
  <g><rect class="card" x="792" y="168" width="344" height="72" rx="13"/>
  <rect x="792" y="168" width="344" height="5" rx="2.5" fill="#5B8DEF"/>
  <text class="ct" x="810" y="199">Other systems</text>
  <text class="cs" x="810" y="222">read-only JSON, no key</text>
  </g>
  <rect class="band" x="40" y="298" width="1120" height="180" rx="18"/>
  <rect class="chip" x="60" y="312" width="246" height="26" rx="13"/>
  <text class="chiptxt" x="73" y="329.5">DELIVERY, HOSTED ON VERCEL</text>
  <g><rect class="card" x="64" y="350" width="250" height="110" rx="13"/>
  <rect x="64" y="350" width="250" height="5" rx="2.5" fill="#1F5BEA"/>
  <text class="ct" x="82" y="381">Website</text>
  <text class="cs" x="82" y="404">Home, About, Methodology,</text>
  <text class="cs" x="82" y="423">Resources, map of 317 districts</text>
  <text class="cs" x="82" y="442">English and Hindi</text>
  </g>
  <g><rect class="card" x="334" y="350" width="240" height="110" rx="13"/>
  <rect x="334" y="350" width="240" height="5" rx="2.5" fill="#1F5BEA"/>
  <text class="ct" x="352" y="381">Dashboard</text>
  <text class="cs" x="352" y="404">9 pages, including map and API</text>
  <text class="cs" x="352" y="423">4 filters, CSV and JSON</text>
  <text class="cs" x="352" y="442">state data loaded on demand</text>
  </g>
  <g><rect class="card" x="594" y="350" width="220" height="110" rx="13"/>
  <rect x="594" y="350" width="220" height="5" rx="2.5" fill="#1F5BEA"/>
  <text class="ct" x="612" y="381">Assistant</text>
  <text class="cs" x="612" y="404">answers in the browser</text>
  <text class="cs" x="612" y="423">/api/chat function</text>
  <text class="cs" x="612" y="442">optional Gemini wording</text>
  </g>
  <g><rect class="card" x="834" y="350" width="302" height="110" rx="13"/>
  <rect x="834" y="350" width="302" height="5" rx="2.5" fill="#1F5BEA"/>
  <text class="ct" x="852" y="381">Forecast API</text>
  <text class="cs" x="852" y="404">7 read-only endpoints (GET only)</text>
  <text class="cs" x="852" y="423">forecast, flags, demand-index,</text>
  <text class="cs" x="852" y="442">capacity-gap, severity, scenario, meta</text>
  </g>
  <rect class="band" x="40" y="518" width="1120" height="161" rx="18"/>
  <rect class="chip" x="60" y="532" width="503" height="26" rx="13"/>
  <text class="chiptxt" x="73" y="549.5">DATA FILES THE SITE READS, WITH CHECKSUMS IN THE MANIFEST</text>
  <g><rect class="card" x="64" y="570" width="253" height="91" rx="13"/>
  <rect x="64" y="570" width="253" height="5" rx="2.5" fill="#2A9DF4"/>
  <text class="ct" x="82" y="601">core.js, alerts.js</text>
  <text class="cs" x="82" y="624">groups, ranges, capacity,</text>
  <text class="cs" x="82" y="643">rankings</text>
  </g>
  <g><rect class="card" x="337" y="570" width="253" height="91" rx="13"/>
  <rect x="337" y="570" width="253" height="5" rx="2.5" fill="#2A9DF4"/>
  <text class="ct" x="355" y="601">10 state shards</text>
  <text class="cs" x="355" y="624">7,925 series, points</text>
  <text class="cs" x="355" y="643">and flags</text>
  </g>
  <g><rect class="card" x="610" y="570" width="253" height="91" rx="13"/>
  <rect x="610" y="570" width="253" height="5" rx="2.5" fill="#2A9DF4"/>
  <text class="ct" x="628" y="601">Map and site data</text>
  <text class="cs" x="628" y="624">317 shapes,</text>
  <text class="cs" x="628" y="643">headline numbers</text>
  </g>
  <g><rect class="card" x="883" y="570" width="253" height="91" rx="13"/>
  <rect x="883" y="570" width="253" height="5" rx="2.5" fill="#2A9DF4"/>
  <text class="ct" x="901" y="601">Hindi names and text</text>
  <text class="cs" x="901" y="624">states, districts, trades,</text>
  <text class="cs" x="901" y="643">pages</text>
  </g>
  <rect class="band" x="40" y="719" width="1120" height="180" rx="18"/>
  <rect class="chip" x="60" y="733" width="221" height="26" rx="13"/>
  <text class="chiptxt" x="73" y="750.5">BUILD PIPELINE (PYTHON)</text>
  <g><rect class="card" x="64" y="771" width="240" height="110" rx="13"/>
  <rect x="64" y="771" width="240" height="5" rx="2.5" fill="#F2A31B"/>
  <text class="ct" x="82" y="802">Simulated panel</text>
  <text class="cs" x="82" y="825">2000 to 2025, 7,925 series</text>
  <text class="cs" x="82" y="844">317 districts, 25 trades</text>
  <text class="cs" x="82" y="863">LGD codes, NCO-2015</text>
  </g>
  <g><rect class="card" x="324" y="771" width="290" height="110" rx="13"/>
  <rect x="324" y="771" width="290" height="5" rx="2.5" fill="#F2A31B"/>
  <text class="ct" x="342" y="802">ML engine</text>
  <text class="cs" x="342" y="825">XGBoost, direct, 1 to 60 months</text>
  <text class="cs" x="342" y="844">conformal ranges, confidence labels</text>
  <text class="cs" x="342" y="863">Demand Index, capacity gap, flags</text>
  </g>
  <g><rect class="card" x="634" y="771" width="270" height="110" rx="13"/>
  <rect x="634" y="771" width="270" height="5" rx="2.5" fill="#F2A31B"/>
  <text class="ct" x="652" y="802">Exports</text>
  <text class="cs" x="652" y="825">roll-ups, alerts, rankings</text>
  <text class="cs" x="652" y="844">capacity tables, manifest</text>
  <text class="cs" x="652" y="863">SHA-256 of every file</text>
  </g>
  <g><rect class="card" x="924" y="771" width="212" height="110" rx="13"/>
  <rect x="924" y="771" width="212" height="5" rx="2.5" fill="#F2A31B"/>
  <text class="ct" x="942" y="802">Builders</text>
  <text class="cs" x="942" y="825">dashboard, map, site data,</text>
  <text class="cs" x="942" y="844">pages, Hindi text</text>
  <text class="cs" x="942" y="863">and their tests</text>
  </g>
  <path class="arrow" d="M189 292V264"/>
  <path class="arrow" d="M454 292V264"/>
  <path class="arrow" d="M704 292V264"/>
  <path class="arrow" d="M985 292V264"/>
  <path class="arrow" d="M190 512V484"/>
  <path class="arrow" d="M464 512V484"/>
  <path class="arrow" d="M736 512V484"/>
  <path class="arrow" d="M1010 512V484"/>
  <path class="arrow" d="M184 713V685"/>
  <path class="arrow" d="M469 713V685"/>
  <path class="arrow" d="M769 713V685"/>
  <path class="arrow" d="M1030 713V685"/>
  <text class="foot" x="40" y="943">KaushalSetu (SIH26246) · AI-enabled labour market intelligence and skill demand-supply forecasting · simulated data, not official statistics</text>
</svg>
