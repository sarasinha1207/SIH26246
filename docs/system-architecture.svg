<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <title id="t">KaushalSetu system architecture</title>
  <desc id="d">Simulated data flows up through the ML engine and the export pipeline into data files served by Vercel to the website, the dashboard, the assistant and the read-only forecast API, which users read.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2A64F5"/></marker>
    <style>
      .box { fill: #F4F7FD; stroke: #B9C8E6; stroke-width: 1.5; }
      .hi { fill: #E6EEFF; stroke: #2A64F5; stroke-width: 1.8; }
      .warm { fill: #FFF3DC; stroke: #E39A1F; stroke-width: 1.5; }
      .t { fill: #0B1B3A; font-size: 15px; font-weight: 650; }
      .s { fill: #4A5878; font-size: 12.5px; }
      .l { fill: #2A64F5; font-size: 12px; font-weight: 600; }
      .band { fill: none; stroke: #B9C8E6; stroke-dasharray: 5 5; stroke-width: 1.2; }
      .bl { fill: #4A5878; font-size: 11.5px; letter-spacing: .08em; font-weight: 700; }
      line, path.ar { stroke: #2A64F5; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="40" class="t" style="font-size:22px">System architecture</text>
  <text x="30" y="62" class="s">Data flows upwards. All data is simulated.</text>

  <rect class="band" x="20" y="80" width="960" height="92" rx="14"/><text class="bl" x="34" y="100">PEOPLE</text>
  <rect class="box" x="60" y="108" width="270" height="52" rx="10"/><text class="t" x="80" y="132">Planners and skill councils</text><text class="s" x="80" y="150">state units, training providers</text>
  <rect class="box" x="360" y="108" width="270" height="52" rx="10"/><text class="t" x="380" y="132">The public</text><text class="s" x="380" y="150">English or Hindi, phone or desktop</text>
  <rect class="box" x="660" y="108" width="270" height="52" rx="10"/><text class="t" x="680" y="132">Other systems</text><text class="s" x="680" y="150">read-only JSON, no key</text>

  <rect class="band" x="20" y="196" width="960" height="150" rx="14"/><text class="bl" x="34" y="216">DELIVERY, HOSTED ON VERCEL</text>
  <rect class="hi" x="40" y="228" width="200" height="100" rx="10"/><text class="t" x="56" y="254">Website</text><text class="s" x="56" y="274">home, about, resources</text><text class="s" x="56" y="292">map of 317 districts</text><text class="s" x="56" y="310">API page</text>
  <rect class="hi" x="260" y="228" width="200" height="100" rx="10"/><text class="t" x="276" y="254">Dashboard</text><text class="s" x="276" y="274">8 pages incl. map, 4 filters</text><text class="s" x="276" y="292">CSV and JSON downloads</text><text class="s" x="276" y="310">state data loaded on demand</text>
  <rect class="hi" x="480" y="228" width="200" height="100" rx="10"/><text class="t" x="496" y="254">Assistant</text><text class="s" x="496" y="274">answers in the browser</text><text class="s" x="496" y="292">/api/chat function</text><text class="s" x="496" y="310">optional Gemini wording</text>
  <rect class="hi" x="700" y="228" width="260" height="100" rx="10"/><text class="t" x="716" y="254">Forecast API</text><text class="s" x="716" y="274">/api/forecast, /flags, /demand-index,</text><text class="s" x="716" y="292">/capacity-gap, /meta: GET only,</text><text class="s" x="716" y="310">rate limited, standard library</text>

  <rect class="band" x="20" y="370" width="960" height="92" rx="14"/><text class="bl" x="34" y="390">DATA FILES THE SITE READS (BUILT FROM THE EXPORTS, CHECKSUMS IN THE MANIFEST)</text>
  <rect class="box" x="40" y="400" width="210" height="50" rx="10"/><text class="t" x="56" y="422">core.js, alerts.js</text><text class="s" x="56" y="440">groups, ranges, capacity, rankings</text>
  <rect class="box" x="270" y="400" width="210" height="50" rx="10"/><text class="t" x="286" y="422">10 state shards</text><text class="s" x="286" y="440">7,925 series, points and flags</text>
  <rect class="box" x="500" y="400" width="210" height="50" rx="10"/><text class="t" x="516" y="422">map and site data</text><text class="s" x="516" y="440">317 shapes, headline numbers</text>
  <rect class="box" x="730" y="400" width="230" height="50" rx="10"/><text class="t" x="746" y="422">Hindi names and text</text><text class="s" x="746" y="440">states, districts, trades, pages</text>

  <rect class="band" x="20" y="486" width="960" height="136" rx="14"/><text class="bl" x="34" y="506">BUILD PIPELINE (PYTHON)</text>
  <rect class="warm" x="40" y="518" width="210" height="88" rx="10"/><text class="t" x="56" y="542">Simulated panel</text><text class="s" x="56" y="562">2000 to 2025, 7,925 series</text><text class="s" x="56" y="580">317 districts, 25 trades</text><text class="s" x="56" y="598">LGD codes, NCO-2015</text>
  <rect class="warm" x="270" y="518" width="250" height="88" rx="10"/><text class="t" x="286" y="542">ML engine</text><text class="s" x="286" y="562">XGBoost, direct, 1 to 60 months</text><text class="s" x="286" y="580">conformal ranges, confidence labels</text><text class="s" x="286" y="598">Demand Index, capacity gap, flags</text>
  <rect class="warm" x="540" y="518" width="210" height="88" rx="10"/><text class="t" x="556" y="542">Exports</text><text class="s" x="556" y="562">roll-ups, alerts, rankings</text><text class="s" x="556" y="580">capacity tables, manifest</text><text class="s" x="556" y="598">SHA-256 of every file</text>
  <rect class="warm" x="770" y="518" width="190" height="88" rx="10"/><text class="t" x="786" y="542">Builders</text><text class="s" x="786" y="562">dashboard, map, site data,</text><text class="s" x="786" y="580">pages, Hindi text</text><text class="s" x="786" y="598">and their tests</text>

  <line x1="250" y1="562" x2="268" y2="562"/><line x1="520" y1="562" x2="538" y2="562"/><line x1="750" y1="562" x2="768" y2="562"/>
  <line x1="145" y1="484" x2="145" y2="464"/><line x1="375" y1="484" x2="375" y2="464"/><line x1="605" y1="484" x2="605" y2="464"/><line x1="845" y1="484" x2="845" y2="464"/>
  <line x1="140" y1="368" x2="140" y2="348"/><line x1="360" y1="368" x2="360" y2="348"/><line x1="580" y1="368" x2="580" y2="348"/><line x1="830" y1="368" x2="830" y2="348"/>
  <line x1="195" y1="194" x2="195" y2="174"/><line x1="495" y1="194" x2="495" y2="174"/><line x1="795" y1="194" x2="795" y2="174"/>
</svg>
