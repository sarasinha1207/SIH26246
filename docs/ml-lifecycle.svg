<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 722" width="1200" height="722" role="img" aria-labelledby="t d">
  <title id="t">KaushalSetu model lifecycle</title>
  <desc id="d">Ten steps from the simulated panel to the published forecast: features, ablation, tuning on 2010 to 2014, a one-shot test on 2015 to 2019, a one-shot stress test on 2020 to 2025, ranges and flags, the final fit, forecasts, Demand Index and capacity gap, and delivery with checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A4A"/><stop offset=".55" stop-color="#0E3A9A"/><stop offset="1" stop-color="#1B62E0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".88" cy=".08" r=".6">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity=".45"/><stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".05" cy=".95" r=".5">
      <stop offset="0" stop-color="#3C7BFF" stop-opacity=".35"/><stop offset="1" stop-color="#3C7BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".09"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020B26" flood-opacity=".38"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9z" fill="#CFE2FF"/></marker>
    <style>
      text { font-family: Segoe UI, Inter, system-ui, -apple-system, Arial, sans-serif; }
      .title { fill: #FFFFFF; font-size: 32px; font-weight: 750; letter-spacing: -.01em; }
      .sub { fill: #BCD3FF; font-size: 15px; }
      .chip { fill: #FFFFFF; fill-opacity: .14; stroke: #FFFFFF; stroke-opacity: .28; }
      .chiptxt { fill: #E3EDFF; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; }
      .band { fill: #FFFFFF; fill-opacity: .07; stroke: #FFFFFF; stroke-opacity: .22; stroke-width: 1.2; }
      .card { fill: #FFFFFF; filter: url(#sh); }
      .ct { fill: #0B1B3A; font-size: 16.5px; font-weight: 700; }
      .cs { fill: #43547A; font-size: 13px; }
      .arrow { stroke: #CFE2FF; stroke-width: 2.4; fill: none; marker-end: url(#ah); stroke-linecap: round; }
      .foot { fill: #BCD3FF; font-size: 13px; }
    </style>
  </defs>
  <rect width="1200" height="722" fill="url(#bg)"/>
  <rect width="1200" height="722" fill="url(#dots)"/>
  <rect width="1200" height="722" fill="url(#glow)"/>
  <rect width="1200" height="722" fill="url(#glow2)"/>
  <text x="40" y="58" class="title">Model lifecycle</text>
  <text x="40" y="86" class="sub">Each window of time is used for one purpose. Amber cards are opened once and never used to change anything.</text>
  <g><rect class="card" x="40.0" y="122" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="none" stroke-width="0"/>
  <rect x="40.0" y="122" width="205" height="5" rx="2.5" fill="#5B8DEF"/>
  <circle cx="68.0" cy="156" r="15" fill="#5B8DEF"/>
  <text x="68.0" y="161.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">1</text>
  <text class="ct" x="92.0" y="162" style="font-size:16px">Data</text>
  <text class="cs" x="58.0" y="198">simulated panel, 312 months</text>
  <text class="cs" x="58.0" y="218">7,925 series, shocks marked</text>
  <text class="cs" x="58.0" y="238">trades add up to sectors</text>
  </g>
  <g><rect class="card" x="268.8" y="122" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="none" stroke-width="0"/>
  <rect x="268.8" y="122" width="205" height="5" rx="2.5" fill="#5B8DEF"/>
  <circle cx="296.8" cy="156" r="15" fill="#5B8DEF"/>
  <text x="296.8" y="161.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">2</text>
  <text class="ct" x="320.8" y="162" style="font-size:16px">Features</text>
  <text class="cs" x="286.8" y="198">119 candidates, built only</text>
  <text class="cs" x="286.8" y="218">from data known at the</text>
  <text class="cs" x="286.8" y="238">forecast month; leak test</text>
  </g>
  <g><rect class="card" x="497.5" y="122" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="none" stroke-width="0"/>
  <rect x="497.5" y="122" width="205" height="5" rx="2.5" fill="#5B8DEF"/>
  <circle cx="525.5" cy="156" r="15" fill="#5B8DEF"/>
  <text x="525.5" y="161.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">3</text>
  <text class="ct" x="549.5" y="162" style="font-size:16px">Ablation</text>
  <text class="cs" x="515.5" y="198">82 inputs kept; identity</text>
  <text class="cs" x="515.5" y="218">inputs dropped (10.9% to</text>
  <text class="cs" x="515.5" y="238">4.5% error, employed)</text>
  </g>
  <g><rect class="card" x="726.2" y="122" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="none" stroke-width="0"/>
  <rect x="726.2" y="122" width="205" height="5" rx="2.5" fill="#5B8DEF"/>
  <circle cx="754.2" cy="156" r="15" fill="#5B8DEF"/>
  <text x="754.2" y="161.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">4</text>
  <text class="ct" x="778.2" y="162" style="font-size:16px">Tuning</text>
  <text class="cs" x="744.2" y="198">Optuna, 20 trials each,</text>
  <text class="cs" x="744.2" y="218">trees per horizon band;</text>
  <text class="cs" x="744.2" y="238">validation years only</text>
  </g>
  <g><rect class="card" x="955.0" y="122" width="205" height="148" rx="14" style="fill:#FFF4DD" stroke="#F2A31B" stroke-width="2"/>
  <rect x="955.0" y="122" width="205" height="5" rx="2.5" fill="#F2A31B"/>
  <circle cx="983.0" cy="156" r="15" fill="#F2A31B"/>
  <text x="983.0" y="161.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">5</text>
  <text class="ct" x="1007.0" y="162" style="font-size:16px">One-shot test</text>
  <g transform="translate(1130.0 146)"><rect x="0" y="6" width="13" height="10" rx="2.2" fill="#B76E00"/><path d="M3 6V4.2a3.5 3.5 0 0 1 7 0V6" fill="none" stroke="#B76E00" stroke-width="1.8" stroke-linecap="round"/></g>
  <text class="cs" x="973.0" y="198">fit to 2014, scored once on</text>
  <text class="cs" x="973.0" y="218">2015 to 2019 vs 3 baselines;</text>
  <text class="cs" x="973.0" y="238">2 fresh simulated worlds</text>
  </g>
  <g><rect class="card" x="40.0" y="330" width="205" height="148" rx="14" style="fill:#FFF4DD" stroke="#F2A31B" stroke-width="2"/>
  <rect x="40.0" y="330" width="205" height="5" rx="2.5" fill="#F2A31B"/>
  <circle cx="68.0" cy="364" r="15" fill="#F2A31B"/>
  <text x="68.0" y="369.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">6</text>
  <text class="ct" x="92.0" y="370" style="font-size:16px">Stress test</text>
  <g transform="translate(215.0 354)"><rect x="0" y="6" width="13" height="10" rx="2.2" fill="#B76E00"/><path d="M3 6V4.2a3.5 3.5 0 0 1 7 0V6" fill="none" stroke="#B76E00" stroke-width="1.8" stroke-linecap="round"/></g>
  <text class="cs" x="58.0" y="406">fit to 2019, scored once on</text>
  <text class="cs" x="58.0" y="426">2020 to 2025: shocks the</text>
  <text class="cs" x="58.0" y="446">model cannot foresee</text>
  </g>
  <g><rect class="card" x="268.8" y="330" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="none" stroke-width="0"/>
  <rect x="268.8" y="330" width="205" height="5" rx="2.5" fill="#5B8DEF"/>
  <circle cx="296.8" cy="364" r="15" fill="#5B8DEF"/>
  <text x="296.8" y="369.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">7</text>
  <text class="ct" x="320.8" y="370" style="font-size:16px">Ranges, flags</text>
  <text class="cs" x="286.8" y="406">split-conformal ranges</text>
  <text class="cs" x="286.8" y="426">(usual and wide), labels,</text>
  <text class="cs" x="286.8" y="446">relative alerts, precision</text>
  </g>
  <g><rect class="card" x="497.5" y="330" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="#7FB0FF" stroke-width="2"/>
  <rect x="497.5" y="330" width="205" height="5" rx="2.5" fill="#1F5BEA"/>
  <circle cx="525.5" cy="364" r="15" fill="#1F5BEA"/>
  <text x="525.5" y="369.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">8</text>
  <text class="ct" x="549.5" y="370" style="font-size:16px">Final fit</text>
  <text class="cs" x="515.5" y="406">all data to 2025-12;</text>
  <text class="cs" x="515.5" y="426">settings fixed; pairs into</text>
  <text class="cs" x="515.5" y="446">the 2020-23 shock left out</text>
  </g>
  <g><rect class="card" x="726.2" y="330" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="#7FB0FF" stroke-width="2"/>
  <rect x="726.2" y="330" width="205" height="5" rx="2.5" fill="#1F5BEA"/>
  <circle cx="754.2" cy="364" r="15" fill="#1F5BEA"/>
  <text x="754.2" y="369.5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">9</text>
  <text class="ct" x="778.2" y="370" style="font-size:16px">Forecast</text>
  <text class="cs" x="744.2" y="406">60 months; trades add up;</text>
  <text class="cs" x="744.2" y="426">Demand Index, capacity gap;</text>
  <text class="cs" x="744.2" y="446">exports with SHA-256</text>
  </g>
  <g><rect class="card" x="955.0" y="330" width="205" height="148" rx="14" style="fill:#FFFFFF" stroke="#7FB0FF" stroke-width="2"/>
  <rect x="955.0" y="330" width="205" height="5" rx="2.5" fill="#1F5BEA"/>
  <circle cx="983.0" cy="364" r="15" fill="#1F5BEA"/>
  <text x="983.0" y="369.5" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">10</text>
  <text class="ct" x="1007.0" y="370" style="font-size:14.5px">Deliver and check</text>
  <text class="cs" x="973.0" y="406">dashboard, map, API,</text>
  <text class="cs" x="973.0" y="426">assistant, English and Hindi;</text>
  <text class="cs" x="973.0" y="446">tests, audit, speed budget</text>
  </g>
  <path class="arrow" d="M248.0 196.0H263.8"/>
  <path class="arrow" d="M476.8 196.0H492.5"/>
  <path class="arrow" d="M705.5 196.0H721.2"/>
  <path class="arrow" d="M934.2 196.0H950.0"/>
  <path class="arrow" d="M248.0 404.0H263.8"/>
  <path class="arrow" d="M476.8 404.0H492.5"/>
  <path class="arrow" d="M705.5 404.0H721.2"/>
  <path class="arrow" d="M934.2 404.0H950.0"/>
  <path class="arrow" d="M1057.5 274V298H142.5V324"/>
  <rect class="band" x="40" y="504" width="1120" height="172" rx="18"/>
  <rect class="chip" x="60" y="518" width="271" height="26" rx="13"/>
  <text class="chiptxt" x="73" y="535.5">WHICH YEARS ARE USED FOR WHAT</text>
  <rect x="60.0" y="568" width="345.4" height="36" rx="9" fill="#CFE0FF"/>
  <text x="72.0" y="591" fill="#0B1B3A" font-size="13.5" font-weight="700">2000 to 2009: fit</text>
  <rect x="408.4" y="568" width="171.2" height="36" rx="9" fill="#9DBEFF"/>
  <text x="420.4" y="591" fill="#0B1B3A" font-size="13.5" font-weight="700">2010 to 2014: tune</text>
  <rect x="582.6" y="568" width="171.2" height="36" rx="9" fill="#F8CD6A"/>
  <text x="594.6" y="591" fill="#0B1B3A" font-size="13.5" font-weight="700">2015 to 2019: test</text>
  <rect x="756.8" y="568" width="206.0" height="36" rx="9" fill="#F2A93B"/>
  <text x="768.8" y="591" fill="#0B1B3A" font-size="13.5" font-weight="700">2020 to 2025: stress</text>
  <rect x="965.8" y="568" width="171.2" height="36" rx="9" fill="#FFFFFF"/>
  <text x="977.8" y="591" fill="#0B1B3A" font-size="13.5" font-weight="700">2026 to 2030: forecast</text>
  <text class="foot" x="60" y="634">Split by calendar time, never at random. Validation scores were used to tune, so they are not an honest estimate; the test years are calm by design.</text>
  <text class="foot" x="60" y="654">Seekers are the least reliable measure and the fifth year the loosest; the dashboard and the API say so beside the numbers.</text>
  <text class="foot" x="40" y="704" style="fill:#9FBEF5">KaushalSetu (SIH26246) · simulated data, not official statistics</text>
</svg>
