<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <title id="t">KaushalSetu model lifecycle</title>
  <desc id="d">Ten steps from the simulated panel to the published forecast: features, ablation, tuning on 2010 to 2014, a one-shot test on 2015 to 2019, a one-shot stress test on 2020 to 2025, ranges and flags, the final fit, forecasts, Demand Index and capacity gap, and delivery with checks.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2A64F5"/></marker>
    <style>
      .st { fill: #F4F7FD; stroke: #B9C8E6; stroke-width: 1.5; }
      .lock { fill: #FFF3DC; stroke: #E39A1F; stroke-width: 1.8; }
      .fin { fill: #E6EEFF; stroke: #2A64F5; stroke-width: 1.8; }
      .n { fill: #2A64F5; font-size: 13px; font-weight: 800; }
      .t { fill: #0B1B3A; font-size: 14px; font-weight: 650; }
      .s { fill: #4A5878; font-size: 11.5px; }
      .tl { stroke: #B9C8E6; stroke-width: 2; }
      .tk { fill: #4A5878; font-size: 11.5px; font-weight: 600; }
      line.ar { stroke: #2A64F5; stroke-width: 2; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="40" class="t" style="font-size:22px">Model lifecycle</text>
  <text x="30" y="62" class="s">Each window of time is used for one purpose. Amber boxes are opened once and never used to change anything.</text>

  <rect class="st" x="30" y="90" width="170" height="104" rx="10"/><text class="n" x="44" y="112">1</text><text class="t" x="62" y="112">Data</text><text class="s" x="44" y="134">simulated panel, 312 months</text><text class="s" x="44" y="150">7,925 series, shocks marked</text><text class="s" x="44" y="166">trades add up to sectors</text>
  <rect class="st" x="215" y="90" width="170" height="104" rx="10"/><text class="n" x="229" y="112">2</text><text class="t" x="247" y="112">Features</text><text class="s" x="229" y="134">119 candidates built only</text><text class="s" x="229" y="150">from data known at the</text><text class="s" x="229" y="166">forecast month; leak test</text>
  <rect class="st" x="400" y="90" width="170" height="104" rx="10"/><text class="n" x="414" y="112">3</text><text class="t" x="432" y="112">Ablation</text><text class="s" x="414" y="134">82 inputs kept; identity</text><text class="s" x="414" y="150">inputs dropped (10.9% to</text><text class="s" x="414" y="166">4.5% error, employed)</text>
  <rect class="st" x="585" y="90" width="170" height="104" rx="10"/><text class="n" x="599" y="112">4</text><text class="t" x="617" y="112">Tuning</text><text class="s" x="599" y="134">Optuna, 20 trials a measure,</text><text class="s" x="599" y="150">trees per horizon band;</text><text class="s" x="599" y="166">validation years only</text>
  <rect class="lock" x="770" y="90" width="200" height="104" rx="10"/><text class="n" x="784" y="112">5</text><text class="t" x="802" y="112">One-shot test</text><text class="s" x="784" y="134">fit to 2014, scored once on</text><text class="s" x="784" y="150">2015 to 2019 against 3 simple</text><text class="s" x="784" y="166">baselines; 2 fresh worlds</text>

  <rect class="lock" x="30" y="260" width="170" height="104" rx="10"/><text class="n" x="44" y="282">6</text><text class="t" x="62" y="282">Stress test</text><text class="s" x="44" y="304">fit to 2019, scored once on</text><text class="s" x="44" y="320">2020 to 2025: shocks the</text><text class="s" x="44" y="336">model cannot foresee</text>
  <rect class="st" x="215" y="260" width="170" height="104" rx="10"/><text class="n" x="229" y="282">7</text><text class="t" x="247" y="282">Ranges, flags</text><text class="s" x="229" y="304">split-conformal ranges</text><text class="s" x="229" y="320">(usual and wide), labels,</text><text class="s" x="229" y="336">relative alerts and precision</text>
  <rect class="fin" x="400" y="260" width="170" height="104" rx="10"/><text class="n" x="414" y="282">8</text><text class="t" x="432" y="282">Final fit</text><text class="s" x="414" y="304">all data to 2025-12, settings</text><text class="s" x="414" y="320">fixed; pairs reaching into the</text><text class="s" x="414" y="336">2020 to 2023 shock left out</text>
  <rect class="fin" x="585" y="260" width="170" height="104" rx="10"/><text class="n" x="599" y="282">9</text><text class="t" x="617" y="282">Forecast</text><text class="s" x="599" y="304">60 months, trades reconciled;</text><text class="s" x="599" y="320">Demand Index and capacity</text><text class="s" x="599" y="336">gap; exports with SHA-256</text>
  <rect class="fin" x="770" y="260" width="200" height="104" rx="10"/><text class="n" x="784" y="282">10</text><text class="t" x="808" y="282">Deliver and check</text><text class="s" x="784" y="304">dashboard, map, API, assistant,</text><text class="s" x="784" y="320">English and Hindi; tests, audit,</text><text class="s" x="784" y="336">size and speed budget</text>

  <line class="ar" x1="200" y1="142" x2="213" y2="142"/><line class="ar" x1="385" y1="142" x2="398" y2="142"/><line class="ar" x1="570" y1="142" x2="583" y2="142"/><line class="ar" x1="755" y1="142" x2="768" y2="142"/>
  <line class="ar" x1="200" y1="312" x2="213" y2="312"/><line class="ar" x1="385" y1="312" x2="398" y2="312"/><line class="ar" x1="570" y1="312" x2="583" y2="312"/><line class="ar" x1="755" y1="312" x2="768" y2="312"/>

  <line class="tl" x1="40" y1="450" x2="960" y2="450"/>
  <rect x="40" y="436" width="276" height="28" rx="6" fill="#DCE6FA"/><text class="tk" x="52" y="455">2000 to 2009: fit</text>
  <rect x="316" y="436" width="138" height="28" rx="6" fill="#C5D6F7"/><text class="tk" x="326" y="455">2010 to 2014: tune</text>
  <rect x="454" y="436" width="138" height="28" rx="6" fill="#F8D99A"/><text class="tk" x="462" y="455">2015 to 2019: test</text>
  <rect x="592" y="436" width="166" height="28" rx="6" fill="#F8D99A"/><text class="tk" x="602" y="455">2020 to 2025: stress</text>
  <rect x="758" y="436" width="202" height="28" rx="6" fill="#9DB8FF"/><text class="tk" x="770" y="455">2026 to 2030: forecast</text>
  <text class="s" x="40" y="490">Split by calendar time, never at random. Validation scores are not an honest estimate (they were used to tune); the test years are calm by design.</text>
  <text class="s" x="40" y="508">Seekers are the least reliable measure and the fifth year the loosest; the dashboard and the API say so beside the numbers.</text>
</svg>
