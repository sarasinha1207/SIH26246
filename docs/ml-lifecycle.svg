<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 810" width="1500" height="810" font-family="Geist, Segoe UI, system-ui, sans-serif" role="img" aria-label="Machine learning lifecycle and how a forecast is made">
